; TEMPLATE ONLY. Use an external file and replace all REPLACE_* values.
; Section names are fixed. The CLI calls production "prod"; the INI uses PRD.
; Keep environment identities distinct; same server is OK with separate databases.

[SQLSERVER_DEV]
DRIVER = {ODBC Driver 18 for SQL Server}
SERVER = REPLACE_DEV_SERVER
DATABASE = REPLACE_DEV_DATABASE
Trusted_Connection = yes
Encrypt = yes
TrustServerCertificate = no

[SQLSERVER_UAT]
DRIVER = {ODBC Driver 18 for SQL Server}
SERVER = REPLACE_UAT_SERVER
DATABASE = REPLACE_UAT_DATABASE
Trusted_Connection = yes
Encrypt = yes
TrustServerCertificate = no

[SQLSERVER_PRD]
DRIVER = {ODBC Driver 18 for SQL Server}
SERVER = REPLACE_PRD_SERVER
DATABASE = REPLACE_PRD_DATABASE
Trusted_Connection = yes
Encrypt = yes
TrustServerCertificate = no

; For SQL authentication, change Trusted_Connection to no in that section and add:
; username_env = BACKFILL_PRD_USERNAME
; password_env = BACKFILL_PRD_PASSWORD
; Values are names of environment variables, never the credentials themselves.
